<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0606">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>$GODOT_PROJECT_NAME</title>
<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
html, body { width: 100%; height: 100%; }
body {
	background: #0b0606; color: #eadfd6; overflow: hidden;
	touch-action: none; overscroll-behavior: none;
	-webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
	font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
#canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
#canvas:focus { outline: none; }
#boot {
	position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column;
	align-items: center; justify-content: flex-end; padding: 24px 20px max(40px, env(safe-area-inset-bottom));
	background: #0b0606 url(splash.jpg) center / cover no-repeat;
	box-sizing: border-box; transition: opacity .5s;
}
#boot::before {
	content: ""; position: absolute; inset: 0;
	background: linear-gradient(180deg, #0b060666 0%, #0b060633 40%, #0b0606ee 78%, #0b0606 100%);
}
#boot > * { position: relative; }
#boot h1 {
	margin: 0 0 4px; color: #e0321f; letter-spacing: .08em; font-size: clamp(30px, 8vw, 54px);
	text-shadow: 0 2px 18px #000;
}
#boot .tag { margin: 0 0 22px; color: #c9b8ac; text-shadow: 0 1px 6px #000; text-align: center; }
#panel { width: min(520px, 100%); text-align: center; }
#bar { height: 10px; border-radius: 6px; background: #ffffff1a; overflow: hidden; border: 1px solid #ffffff22; }
#fill { height: 100%; width: 0; background: linear-gradient(90deg, #8e130c, #e0321f); transition: width .2s; }
#bar.busy #fill { width: 35%; animation: busy 1.2s ease-in-out infinite; }
@keyframes busy { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
#msg { margin: 10px 0 0; color: #b9a89c; font-size: 15px; min-height: 22px; }
#play {
	display: none; width: 100%; margin-top: 4px; padding: 18px; border-radius: 14px; font: inherit; font-size: 21px;
	font-weight: 700; letter-spacing: .06em; color: #fff; background: #8e130c; border: 1px solid #d0402f; cursor: pointer;
	box-shadow: 0 6px 30px #6b0d0899;
}
#play:active { background: #b3190f; }
#retry {
	display: none; width: 100%; margin-top: 14px; padding: 14px; border-radius: 14px; font: inherit; font-weight: 600;
	color: #fff; background: #1d1110; border: 1px solid #8e130c; cursor: pointer;
}
#note { display: none; margin-top: 14px; color: #d7cbc2; font-size: 15px; text-align: left; }
#note b { color: #fff; }
#fs {
	display: none; position: fixed; z-index: 3; left: 50%; top: max(8px, env(safe-area-inset-top)); transform: translateX(-50%);
	padding: 6px 14px; border-radius: 18px; border: 1px solid #ffffff40; background: #00000088; color: #fff;
	font: 600 13px system-ui, sans-serif; letter-spacing: .04em; opacity: .75;
}
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
<noscript>RaGoon City needs JavaScript.</noscript>
<div id="boot">
	<h1>RAGOON CITY</h1>
	<p class="tag">Two-player co-op survival horror. The city has gone silent.</p>
	<div id="panel">
		<div id="bar" class="busy"><div id="fill"></div></div>
		<p id="msg">Loading the city…</p>
		<button id="play" type="button">ENTER THE CITY</button>
		<button id="retry" type="button">Try again</button>
		<div id="note"></div>
	</div>
</div>
<button id="fs" type="button">⛶ Full screen</button>
<script src="$GODOT_URL"></script>
<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
(function () {
	const boot = document.getElementById('boot');
	const bar = document.getElementById('bar');
	const fill = document.getElementById('fill');
	const msg = document.getElementById('msg');
	const play = document.getElementById('play');
	const retry = document.getElementById('retry');
	const note = document.getElementById('note');
	const fsBtn = document.getElementById('fs');
	const mb = (n) => (n / 1048576).toFixed(n < 10485760 ? 1 : 0);
	const hex = (b) => Array.from(new Uint8Array(b), (x) => x.toString(16).padStart(2, '0')).join('');
	let running = false;

	function fail(text, html, canRetry) {
		bar.style.display = 'none';
		play.style.display = 'none';
		msg.textContent = text;
		note.innerHTML = html || '';
		note.style.display = html ? 'block' : 'none';
		retry.style.display = canRetry ? 'block' : 'none';
	}
	function progress(frac, text) {
		bar.style.display = 'block';
		bar.classList.remove('busy');
		fill.style.width = (Math.min(1, Math.max(0, frac)) * 100).toFixed(1) + '%';
		msg.textContent = text;
	}
	function busy(text) {
		bar.style.display = 'block';
		bar.classList.add('busy');
		fill.style.width = '0';
		msg.textContent = text;
	}
	function Problem(title, detail) { this.title = title; this.detail = detail; }
	retry.addEventListener('click', () => location.reload());

	// Keep cached game data from being cleared when the phone runs low on space.
	try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
	document.addEventListener('contextmenu', (e) => e.preventDefault());

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length) {
		fail('This browser can\'t run RaGoon City.',
			'Open this page in <b>Chrome</b> or <b>Samsung Internet</b> (not inside another app\'s built-in browser).<br><br>Missing: ' + missing.join(', '));
		return;
	}

	const exe = GODOT_CONFIG.executable;
	const pack = GODOT_CONFIG.mainPack || (exe + '.pck');
	// The game itself is the same content packs the Android app downloads
	// (/packs/ on the download worker). They're kept in this browser's Cache
	// Storage between visits, so only packs that changed download again, and
	// copied into the engine's in-memory files at /packs before it starts
	// (boot/pack_mount.gd mounts them from there).
	const PACKS = new URL('/packs/', location.href).href;
	const CACHE = 'ragoon-packs-v1';
	const PARALLEL = 3;
	let engine = null;
	// Times the game reloaded this page for a newer version in the last two
	// minutes (boot/boot.gd stops asking after two, so it can't loop).
	let reloads = { n: 0, t: 0 };
	try { reloads = JSON.parse(sessionStorage.getItem('ragoonReloads')) || reloads; } catch (e) {}
	if (Date.now() - reloads.t > 120000) reloads = { n: 0, t: 0 };
	window.ragoonRestarts = reloads.n;

	function makeEngine() {
		return new Engine(Object.assign({}, GODOT_CONFIG, {
			onProgress: function (current, total) {
				if (current > 0 && total > 0) progress(current / total, 'Starting up… ' + mb(current) + ' / ' + mb(total) + ' MB');
			},
			onExit: function (code) {
				running = false;
				fsBtn.style.display = 'none';
				boot.style.display = 'flex';
				boot.style.opacity = '1';
				fail('The game stopped' + (code ? ' (code ' + code + ')' : '') + '.', 'Reload the page to play again. Your saves are kept.', true);
			},
		}));
	}

	// Called by the game (PackMount.restart) when a newer version came out
	// while the page was open: loading the page again fetches it.
	window.ragoonReload = function () {
		try { sessionStorage.setItem('ragoonReloads', JSON.stringify({ n: reloads.n + 1, t: Date.now() })); } catch (e) {}
		location.reload();
	};

	async function getJson(url) {
		const r = await fetch(url, { cache: 'no-store' });
		if (!r.ok) throw new Error(url + ' answered ' + r.status);
		return r.json();
	}

	async function openCache() {
		try { return window.caches ? await caches.open(CACHE) : null; } catch (e) { return null; }
	}

	// Downloads one pack and checks its SHA-256. onBytes(n) reports progress
	// (negative when a failed try is taken back).
	async function download(p, onBytes) {
		let lastError = null;
		for (let attempt = 0; attempt < 4; attempt++) {
			let got = 0;
			const stop = new AbortController();
			let timer = 0;
			const kick = () => { clearTimeout(timer); timer = setTimeout(() => stop.abort(), 30000); };
			try {
				kick();
				const r = await fetch(PACKS + encodeURIComponent(p.file), { cache: 'no-store', signal: stop.signal });
				if (!r.ok) throw new Error('the server answered ' + r.status);
				const reader = r.body.getReader();
				const parts = [];
				for (;;) {
					const { done, value } = await reader.read();
					if (done) break;
					kick();
					parts.push(value);
					got += value.length;
					onBytes(value.length);
				}
				const buf = await new Blob(parts).arrayBuffer();
				if (buf.byteLength !== p.size) throw new Error('a download came through incomplete');
				if (crypto.subtle && hex(await crypto.subtle.digest('SHA-256', buf)) !== p.sha256) throw new Error('a download came through damaged');
				return buf;
			} catch (e) {
				lastError = stop.signal.aborted ? new Error('the download stalled') : e;
				onBytes(-got);
				await new Promise((r) => setTimeout(r, 2000 * (attempt + 1)));
			} finally {
				clearTimeout(timer);
			}
		}
		throw lastError;
	}

	// Gets every pack of the newest content set into the engine, downloading
	// only the ones this browser doesn't have yet.
	async function loadPacks() {
		const cache = await openCache();
		const saved = cache ? await cache.match('installed.json').then((r) => r && r.json()).catch(() => null) : null;
		let info = null;
		let set = null;
		try { info = await getJson('build_info.json'); } catch (e) {}
		try { set = await getJson(PACKS + 'manifest.json'); } catch (e) {}
		if (set && info && set.base !== info.base) {
			// The content on the server is for another version of this page
			// (an upload is under way): play the copy here if it fits.
			if (saved && saved.base === info.base) set = saved;
			else throw new Problem('The game is being updated.', 'Try again in a few minutes.');
		}
		const online = !!set;
		if (!set) set = saved;
		if (!set) throw new Problem('Couldn\'t reach the server.', 'Check your connection and try again.');

		const have = {};
		if (cache) for (const p of set.packs) have[p.file] = !!(await cache.match(PACKS + p.file));
		const todo = set.packs.filter((p) => !have[p.file]);
		const total = todo.reduce((n, p) => n + p.size, 0);
		if (todo.length && !online) throw new Problem('Couldn\'t reach the server.', 'Check your connection and try again.');
		let keep = !!cache;
		if (total && keep && navigator.storage && navigator.storage.estimate) {
			try {
				const est = await navigator.storage.estimate();
				if (est.quota && est.quota - est.usage < total + 67108864) keep = false;
			} catch (e) {}
		}

		// Packs this browser already has: straight into the engine.
		const cached = set.packs.filter((p) => have[p.file]);
		const cachedBytes = cached.reduce((n, p) => n + p.size, 0);
		let copied = 0;
		for (const p of cached) {
			const r = await cache.match(PACKS + p.file);
			engine.copyToFS('/packs/' + p.file, await r.arrayBuffer());
			copied += p.size;
			if (!total) progress(copied / cachedBytes, 'Opening the city…');
		}

		// The rest: a few at a time, each into the engine as soon as it's here.
		if (total) {
			const first = !saved;
			note.innerHTML = first
				? 'The first visit downloads the game once (' + mb(total) + ' MB, Wi-Fi recommended). After that it opens straight away and only updates download.'
				: (keep ? '' : 'Not enough free space to keep the game in this browser, so it will download again next time.');
			note.style.display = note.innerHTML ? 'block' : 'none';
			let done = 0;
			const t0 = Date.now();
			const show = () => {
				const secs = (Date.now() - t0) / 1000;
				const rate = secs > 1 ? '  ·  ' + (done / 1048576 / secs).toFixed(1) + ' MB/s' : '';
				progress(done / total, (first ? 'Downloading the city… ' : 'Downloading the update… ') + mb(done) + ' / ' + mb(total) + ' MB' + rate);
			};
			show();
			const queue = todo.slice();
			const worker = async () => {
				for (let p = queue.shift(); p; p = queue.shift()) {
					const buf = await download(p, (n) => { done += n; show(); });
					engine.copyToFS('/packs/' + p.file, buf);
					if (keep) {
						try {
							await cache.put(PACKS + p.file, new Response(buf, { headers: { 'content-type': 'application/octet-stream' } }));
						} catch (e) { keep = false; }
					}
				}
			};
			const workers = [];
			for (let i = 0; i < PARALLEL; i++) workers.push(worker());
			try {
				await Promise.all(workers);
			} catch (e) {
				queue.length = 0;
				throw new Problem('The download stopped.', 'Check your connection and try again (' + (e.message || e) + '). What came through is kept.');
			}
			note.style.display = 'none';
		}

		// PackMount reads this to know which packs make up the game.
		engine.copyToFS('/packs/installed.json', new TextEncoder().encode(JSON.stringify(set)).buffer);
		if (cache && keep) {
			try {
				await cache.put('installed.json', new Response(JSON.stringify(set), { headers: { 'content-type': 'application/json' } }));
				// Drop packs no longer in the game.
				const files = new Set(set.packs.map((p) => PACKS + p.file));
				for (const req of await cache.keys()) {
					if (req.url.startsWith(PACKS) && !files.has(req.url)) await cache.delete(req);
				}
			} catch (e) {}
		}
	}

	async function load() {
		play.style.display = 'none';
		retry.style.display = 'none';
		note.style.display = 'none';
		boot.style.display = 'flex';
		boot.style.opacity = '1';
		busy(reloads.n ? 'Loading the new version…' : 'Loading the city…');
		try {
			engine = makeEngine();
			window.ragoonEngine = engine;
			await Promise.all([engine.init(exe), engine.preloadFile(pack, pack)]);
			await loadPacks();
		} catch (e) {
			if (e instanceof Problem) fail(e.title, e.detail, true);
			else fail('Couldn\'t load the game.', 'Check your connection and try again. (' + String(e && e.message || e) + ')', true);
			return;
		}
		bar.style.display = 'none';
		msg.textContent = reloads.n ? 'The new version is ready.' : 'Ready. Headphones on.';
		play.style.display = 'block';
	}

	function start() {
		// ?verbose=1 turns on Godot's verbose log in the browser console.
		const extra = /[?&]verbose=1/.test(location.search) ? ['--verbose'] : [];
		return engine.start({ args: ['--main-pack', pack].concat(GODOT_CONFIG.args || [], extra) }).then(function () {
			running = true;
			boot.style.opacity = '0';
			setTimeout(() => { boot.style.display = 'none'; }, 500);
			syncFsButton();
		}, function (err) {
			fail('The game couldn\'t start.', String(err && err.message || err), true);
		});
	}

	load();

	function goFullscreen() {
		const el = document.documentElement;
		const req = el.requestFullscreen || el.webkitRequestFullscreen;
		if (req && !document.fullscreenElement) {
			try { const p = req.call(el, { navigationUI: 'hide' }); if (p && p.catch) p.catch(() => {}); } catch (e) {}
		}
	}

	let wakeLock = null;
	async function keepAwake() {
		try { if ('wakeLock' in navigator && document.visibilityState === 'visible') wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
	}
	document.addEventListener('visibilitychange', () => { if (running && document.visibilityState === 'visible') keepAwake(); });

	function syncFsButton() {
		const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
		const standalone = window.matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches;
		fsBtn.style.display = running && !isFs && !standalone && (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen) ? 'block' : 'none';
	}
	document.addEventListener('fullscreenchange', syncFsButton);
	document.addEventListener('webkitfullscreenchange', syncFsButton);
	fsBtn.addEventListener('click', goFullscreen);

	play.addEventListener('click', function () {
		play.disabled = true;
		msg.textContent = 'Starting…';
		goFullscreen();
		keepAwake();
		start();
	});
}());
</script>
</body>
</html>
